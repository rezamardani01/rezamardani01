  <rect x="12" y="12" width="1180" height="244" rx="25" fill="#28231F"/>
  <rect x="5" y="5" width="1180" height="244" rx="24" fill="#FFF9EF" stroke="#28231F" stroke-width="4"/>
  <rect x="5" y="5" width="1180" height="244" rx="24" fill="url(#dots)" clip-path="url(#card)"/>
  <rect x="43" y="33" width="180" height="35" rx="14" fill="#C9E9DF" stroke="#28231F" stroke-width="3"/>
  <text x="133" y="56" text-anchor="middle" fill="#28231F" class="mono" font-size="13" font-weight="700" letter-spacing="1">WHO I AM</text>
  <text x="43" y="116" fill="#28231F" class="round" font-size="39" font-weight="900">Backend developer</text>
  <text x="43" y="151" fill="#625A53" class="round" font-size="18" font-weight="700">I build useful software, bots, and tools for messaging platforms.</text>
  <rect x="47" y="184" width="151" height="38" rx="15" fill="#28231F"/>
  <rect x="43" y="180" width="151" height="38" rx="15" fill="#C8E4F6" stroke="#28231F" stroke-width="3"/>
  <text x="118" y="207" text-anchor="middle" fill="#28231F" class="round" font-size="14" font-weight="900">BACKEND</text>
  <rect x="215" y="184" width="194" height="38" rx="15" fill="#28231F"/>
  <rect x="211" y="180" width="194" height="38" rx="15" fill="#FFE3A5" stroke="#28231F" stroke-width="3"/>
  <text x="308" y="207" text-anchor="middle" fill="#28231F" class="round" font-size="14" font-weight="900">BOTS &amp; PLATFORMS</text>
  <rect x="426" y="184" width="174" height="38" rx="15" fill="#28231F"/>
  <rect x="422" y="180" width="174" height="38" rx="15" fill="#E4D6F8" stroke="#28231F" stroke-width="3"/>
