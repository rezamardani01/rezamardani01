  <rect x="831" y="45" width="303" height="158" rx="20" fill="#FFFDF8" stroke="#28231F" stroke-width="4"/>
  <rect x="847" y="60" width="111" height="27" rx="10" fill="#FFD4D0"/>
  <text x="902" y="78" text-anchor="middle" fill="#625A53" class="mono" font-size="12" font-weight="700">~/approach</text>
  <circle cx="865" cy="112" r="6" fill="#E77968" stroke="#28231F" stroke-width="2"/>
