<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-label="Who I am — Reza Mardani, backend developer, bot builder, and open-source maker.">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#766D65" fill-opacity=".14"/>
    </pattern>
    <clipPath id="card">
      <rect x="5" y="5" width="1180" height="244" rx="24"/>
    </clipPath>
    <style>
      .round { font-family: "Arial Rounded MT Bold", "Trebuchet MS", "Nunito", Arial, sans-serif; }
      .mono { font-family: "Cascadia Code", "Courier New", monospace; }
