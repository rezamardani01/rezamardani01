<svg xmlns="http://www.w3.org/2000/svg" width="416" height="217" viewBox="0 0 416 217" role="img" aria-labelledby="title desc">
  <title id="title">CodeTree</title>
  <desc id="desc">Developer tool. Explore files by language and lines of code.</desc>
